name: Sleduj volne jazdy

on:  
  workflow_dispatch: {} # umoznuje aj rucne spustenie z GitHub UI

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Spusti kontrolu
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: npm run check

      - name: Uloz zmeny v state.json spat do repozitara
        run: |
          git config user.name "autoskola-watcher-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json
          git diff --quiet --cached || git commit -m "update state [skip ci]"
          git push
