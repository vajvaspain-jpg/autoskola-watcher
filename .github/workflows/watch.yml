name: Sleduj volne jazdy

on:
  workflow_dispatch: {}

permissions:
  contents: write

# Behy sa neprekryvaju - dalsi beh pocka na dokoncenie predosleho.
concurrency:
  group: watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Spusti kontrolu
        run: npm run check
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

      - name: Uloz zmeny v state.json spat do repozitara
        run: |
          git config user.name "autoskola-watcher-bot"
          git config user.email "autoskola-watcher-bot@users.noreply.github.com"
          git add state.json
          if git diff --cached --quiet; then
            echo "Ziadna zmena stavu."
            exit 0
          fi
          git commit -m "update state [skip ci]"
          for i in 1 2 3 4 5; do
            if git push; then exit 0; fi
            echo "Push zlyhal, skusam znova ($i)..."
            git pull --rebase -X theirs origin main || git rebase --abort
            sleep 3
          done
          exit 1
