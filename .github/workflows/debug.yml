name: Debug - over strukturu stranky

on:
  workflow_dispatch: {}

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Spusti debug rezim
        run: node scrape.js --debug
        continue-on-error: true

      - name: Nahraj vysledky ako stiahnutelny subor
        uses: actions/upload-artifact@v4
        with:
          name: debug-vystup
          path: |
            debug-screenshot.png
            debug-html.txt
            debug-log.txt
            debug-screenshot-calendar.png
            debug-html-calendar.txt
          if-no-files-found: warn
